<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input.invalid {
        border: 2px solid #c72939;
        background-color: #ffe6e6;
        outline: none;
      }

      input.valid {
        border: 2px solid #1ead40;
        background-color: #e6ffe6;
        outline: none;
      }

      .hint {
        display: none;
        font-size: 0.85rem;
        color: #007bff;
        margin-top: 4px;
      }

      .hint.show {
        display: block;
      }

      .error {
        display: none;
        font-size: 0.85rem;
        color: #dc3545;
        margin-top: 4px;
      }

      .error.show {
        display: block;
      }
    </style>
    <script src="eventHanding.js" defer></script>
  </head>
  <body>
    <form name="main" id="registrationForm" novalidate>
      <div class="form__group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" />
        <span class="hint">Enter full name</span>
        <span class="error"></span>
      </div>

      <div class="form__group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <span class="hint">Format: example@domain.com</span>
        <span class="error"></span>
      </div>

      <div class="form__group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" />
        <span class="hint">Minimum 6 symbols</span>
        <span class="error"></span>
      </div>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
